# /etc/systemd/system/aiseamen.service
[Unit]
Description=ai.seamen.love Node.js Server
After=network.target

[Service]
ExecStartPre=-/bin/bash -c 'lsof -ti:443 | xargs -r kill -9 || true'
ExecStartPre=-/bin/bash -c 'lsof -ti:80 | xargs -r kill -9 || true'
Type=simple
ExecStart=/usr/bin/npx tsx src/server.ts
ExecReload=/bin/kill -HUP $MAINPID
ExecStop=/bin/kill -TERM $MAINPID
KillMode=mixed
TimeoutStopSec=10
Restart=on-failure
RestartSec=5
User=root
Group=root
Environment=PATH=/usr/bin:/usr/local/bin
Environment=NODE_ENV=production
WorkingDirectory=/root/ai.seamen.love
LimitNOFILE=65536
OOMScoreAdjust=-500

[Install]
WantedBy=multi-user.target