<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seamen Drinking API Interface</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      margin: 0;
      padding: 20px;
      color: #ffffff;
    }

    h1 {
      color: #ffffff;
      text-align: center;
    }

    textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #444;
      border-radius: 4px;
      resize: vertical;
      background-color: #2d2d2d;
      color: #ffffff;
    }

    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #45a049;
    }

    #response {
      margin-top: 20px;
      font-weight: bold;
      color: #4CAF50;
    }

    #responseToggle {
      margin-top: 20px;
      font-weight: bold;
      color: #4CAF50;
    }

    #generatedPrompts {
      background-color: #2d2d2d;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 4px;
      white-space: pre-wrap;
      color: #ffffff;
    }

    input[type="number"] {
      background-color: #2d2d2d;
      color: #ffffff;
      border: 1px solid #444;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    input[type="checkbox"] {
      accent-color: #4CAF50;
    }
  </style>
</head>

<body>
  <h1>Seamen Drinking API Interface</h1>

  <textarea id="darePrompt" rows="3" placeholder="Enter dare prompt..."></textarea>
  <textarea id="truthPrompt" rows="3" placeholder="Enter truth prompt..."></textarea>
  <textarea id="drinkPrompt" rows="3" placeholder="Enter drink prompt..."></textarea>
  <textarea id="tablePrompt" rows="3" placeholder="Enter table prompt..."></textarea>
  <input type="number" id="promptAmount" rows="1" placeholder="Enter promptAmount" />

  <button onclick="sendPrompts()">Update Prompts</button>
  <p id="response"></p>

  <h2>Generated Prompts</h2>
  <pre id="generatedPrompts"></pre>
  <br />

  <input type="checkbox" id="ToggleA" />Toggle a
  <br />
  <button onclick="sendToggles()">Update toggles</button>

  <p id="responseToggle"></p>


  <script>
    async function loadCurrentPrompts() {
      const response = await fetch('/current-prompts');
      if (response.ok) {
        const data = await response.json();
        document.getElementById('darePrompt').value = data.darePrompt;
        document.getElementById('truthPrompt').value = data.truthPrompt;
        document.getElementById('drinkPrompt').value = data.drinkPrompt;
        document.getElementById('tablePrompt').value = data.tablePrompt;
        document.getElementById('promptAmount').value = data.promptAmount;
      } else {
        console.error('Failed to load current prompts');
      }
    }

    async function sendPrompts() {
      const darePrompt = document.getElementById('darePrompt').value;
      const truthPrompt = document.getElementById('truthPrompt').value;
      const drinkPrompt = document.getElementById('drinkPrompt').value;
      const tablePrompt = document.getElementById('tablePrompt').value;
      const promptAmount = document.getElementById('promptAmount').value;
      const responseElement = document.getElementById('response');
      const generatedPromptsElement = document.getElementById('generatedPrompts');
      responseElement.textContent = 'Updating...';

      const response = await fetch('/regenerate', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({darePrompt, truthPrompt, drinkPrompt, tablePrompt, promptAmount})
      });

      if (response.ok) {
        responseElement.textContent = 'Prompts updated successfully';
        const data = await response.json();
        generatedPromptsElement.textContent = data.prompts;
      } else {
        responseElement.textContent = 'Error updating prompts';
      }
    }

    async function sendToggles() {
      console.log("Sending toggles");
      console.log(document.getElementById("ToggleA").value);
      const toggleA = document.getElementById("ToggleA").value == "on";
      const responseElement = document.getElementById('responseToggle');

      console.log("ToggleA: " + toggleA);

      const response = await fetch('/settoggles', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({toggleA: toggleA})
      });

      if (response.ok) {
        responseElement.textContent = 'Toggles updated successfully';
        const data = await response.json();
      } else {
        responseElement.textContent = 'Error updating toggles';
      }
    }

    window.onload = loadCurrentPrompts;
  </script>
</body>

</html>
